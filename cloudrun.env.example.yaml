OPENAI_API_KEY: "set-in-secret-manager"
OPENAI_BASE_URL: "https://openrouter.ai/api/v1"
OPENAI_MODEL: "google/gemini-3.1-flash-lite"
MODEL_GATEWAY: "openrouter"
MODEL_POLICY_PRESET: "budget-structured"

# Phase 1 migration switches. Keep these as "supabase" until Cloud SQL and GCS
# are created, tested, and the app code path has been moved intentionally.
INFRA_PROVIDER: "supabase"
DATABASE_PROVIDER: "supabase"
STORAGE_PROVIDER: "supabase"

SUPABASE_URL: "https://your-project.supabase.co"
NEXT_PUBLIC_SUPABASE_URL: "https://your-project.supabase.co"
SUPABASE_SERVICE_ROLE_KEY: "set-in-secret-manager"

# Phase 4 identity migration. Supabase remains live until Firebase identity
# mappings and cross-user authorization tests pass in staging.
AUTH_PROVIDER: "supabase"
FIREBASE_PROJECT_ID: "set-in-secret-manager"
FIREBASE_CLIENT_EMAIL: "set-in-secret-manager"
FIREBASE_PRIVATE_KEY: "set-in-secret-manager"
FIREBASE_CHECK_REVOKED: "true"

GOOGLE_CLOUD_PROJECT_ID: "your-google-cloud-project-id"
GOOGLE_CLOUD_REGION: "asia-southeast1"
GCS_UPLOAD_BUCKET: "papertrend-uploads-staging"
CLOUD_SQL_INSTANCE_CONNECTION_NAME: "research-trend-analysis:asia-southeast1:papertrend-pg"
GOOGLE_SERVICE_ACCOUNT_EMAIL: "papertrend-app-runtime@research-trend-analysis.iam.gserviceaccount.com"
DATABASE_URL: "postgresql://papertrend_app:password@localhost:5432/papertrend"
CLOUDSQL_DUAL_WRITE_ENABLED: "false"
CLOUDSQL_DUAL_WRITE_OWNER_IDS: ""
CLOUDSQL_SHADOW_READ_ENABLED: "false"
CLOUDSQL_SHADOW_OWNER_IDS: ""

GOOGLE_CLIENT_ID: "set-in-google-cloud-oauth"
GOOGLE_CLIENT_SECRET: "set-in-secret-manager"
GOOGLE_DRIVE_REDIRECT_URI: "https://your-domain.example/api/integrations/google-drive/callback"

WORKER_WEBHOOK_SECRET: "set-in-secret-manager"
WORKER_OIDC_SERVICE_ACCOUNTS: "papertrend-worker-trigger@your-project.iam.gserviceaccount.com"
WORKER_OIDC_AUDIENCE: "https://your-cloud-run-service-url"
CLOUD_TASKS_OIDC_SERVICE_ACCOUNT: "papertrend-worker-trigger@your-project.iam.gserviceaccount.com"
NODE_SERVICE_HOST: "0.0.0.0"
NODE_SERVICE_PORT: "8080"
NODE_SERVICE_LOG_LEVEL: "INFO"
APP_ALLOWED_ORIGINS: "https://your-domain.example"

LOGIN_RATE_LIMIT_ATTEMPTS: "5"
LOGIN_RATE_LIMIT_WINDOW_SECONDS: "900"
AI_DAILY_MESSAGE_LIMIT: "100"
AI_DAILY_DEEP_RESEARCH_LIMIT: "10"
MAX_UPLOAD_BYTES: "26214400"
MAX_PDF_PAGES: "80"
