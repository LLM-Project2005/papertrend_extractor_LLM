# Phase 8D production worker candidate. It is deployed separately and does not
# receive tasks until the production queue is explicitly configured at cutover.
steps:
  - id: deploy-worker-production-candidate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --project
      - ${PROJECT_ID}
      - --region
      - ${_REGION}
      - --source
      - .
      - --add-cloudsql-instances
      - ${_CLOUD_SQL_INSTANCE_CONNECTION_NAME}
      - --allow-unauthenticated
      - --service-account
      - ${_RUNTIME_SERVICE_ACCOUNT}
      - --memory
      - 1Gi
      - --cpu
      - "1"
      - --cpu-throttling
      - --timeout
      - "900"
      - --concurrency
      - "4"
      - --min-instances
      - "0"
      - --max-instances
      - "2"
      - --set-build-env-vars
      - GOOGLE_RUNTIME_VERSION=3.13,GOOGLE_ENTRYPOINT=python node_service.py --host 0.0.0.0 --port 8080
      - --set-env-vars
      - INFRA_PROVIDER=google,DATABASE_PROVIDER=cloud-sql,STORAGE_PROVIDER=gcs,GOOGLE_CLOUD_PROJECT_ID=${PROJECT_ID},GOOGLE_CLOUD_REGION=${_REGION},GCS_UPLOAD_BUCKET=${_GCS_UPLOAD_BUCKET},CLOUD_SQL_INSTANCE_CONNECTION_NAME=${_CLOUD_SQL_INSTANCE_CONNECTION_NAME},GOOGLE_SERVICE_ACCOUNT_EMAIL=${_RUNTIME_SERVICE_ACCOUNT},WORKER_OIDC_SERVICE_ACCOUNTS=${_TRIGGER_SERVICE_ACCOUNT};${_WEB_SERVICE_ACCOUNT},WORKER_OIDC_AUDIENCE=${_WORKER_OIDC_AUDIENCE},CLOUD_TASKS_OIDC_SERVICE_ACCOUNT=${_TRIGGER_SERVICE_ACCOUNT},NODE_SERVICE_HOST=0.0.0.0,NODE_SERVICE_PORT=8080,NODE_SERVICE_LOG_LEVEL=INFO,MODEL_GATEWAY=openrouter,MODEL_POLICY_PRESET=budget-structured,NODE_SERVICE_ASYNC_MAX_RUNS=1,NODE_SERVICE_QUEUE_STALE_LOCK_SECONDS=1200,WORKER_STALE_PROCESSING_AFTER_SECONDS=360,WORKER_HEARTBEAT_INTERVAL_SECONDS=60,WORKER_HEARTBEAT_TIMEOUT_SECONDS=10,WORKER_HEARTBEAT_ATTEMPTS=2,CLOUD_TASKS_PROJECT_ID=${PROJECT_ID},CLOUD_TASKS_LOCATION=${_REGION},CLOUD_TASKS_QUEUE=${_CLOUD_TASKS_QUEUE},CLOUD_TASKS_MAX_TASKS_PER_REQUEST=50,CLOUD_TASKS_TASK_SPACING_SECONDS=15,MAX_UPLOAD_BYTES=26214400,MAX_PDF_PAGES=80,APP_ALLOWED_ORIGINS=${_APP_ALLOWED_ORIGINS}
      - --set-secrets
      - OPENAI_API_KEY=OPENAI_API_KEY:latest,OPENAI_BASE_URL=OPENAI_BASE_URL:latest,WORKER_WEBHOOK_SECRET=WORKER_WEBHOOK_SECRET:latest,DATABASE_URL=DATABASE_URL:latest

substitutions:
  _REGION: asia-southeast1
  _SERVICE_NAME: papertrend-worker-production
  _RUNTIME_SERVICE_ACCOUNT: papertrend-worker-production@${PROJECT_ID}.iam.gserviceaccount.com
  _TRIGGER_SERVICE_ACCOUNT: papertrend-tasks-production@${PROJECT_ID}.iam.gserviceaccount.com
  _WEB_SERVICE_ACCOUNT: papertrend-web-production@${PROJECT_ID}.iam.gserviceaccount.com
  _CLOUD_SQL_INSTANCE_CONNECTION_NAME: research-trend-analysis:asia-southeast1:papertrend-pg
  _GCS_UPLOAD_BUCKET: research-trend-analysis-papertrend-uploads-production
  _CLOUD_TASKS_QUEUE: papertrend-ingestion-production
  _WORKER_OIDC_AUDIENCE: set-after-worker-deployment
  _APP_ALLOWED_ORIGINS: set-after-web-deployment

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
