# Phase 5 staging deployment for the Next.js web/API service.
# Vercel remains the rollback and production frontend while this service is
# validated directly through its Cloud Run URL.

steps:
  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - eil-dashboard/Dockerfile
      - --tag
      - ${_IMAGE}
      - --build-arg
      - NEXT_PUBLIC_AUTH_PROVIDER=${_NEXT_PUBLIC_AUTH_PROVIDER}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - eil-dashboard

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --project
      - ${PROJECT_ID}
      - --region
      - ${_REGION}
      - --image
      - ${_IMAGE}
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - 1Gi
      - --cpu
      - "1"
      - --timeout
      - "300"
      - --concurrency
      - "20"
      - --min-instances
      - "0"
      - --max-instances
      - "2"
      - --service-account
      - ${_RUNTIME_SERVICE_ACCOUNT}
      - --set-env-vars
      - AUTH_PROVIDER=firebase,DATABASE_PROVIDER=supabase,STORAGE_PROVIDER=gcs,GOOGLE_CLOUD_PROJECT_ID=${PROJECT_ID},GOOGLE_CLOUD_REGION=${_REGION},GCS_UPLOAD_BUCKET=${_GCS_UPLOAD_BUCKET},WORKER_SERVICE_URL=${_WORKER_SERVICE_URL},FIREBASE_CHECK_REVOKED=true,APP_ALLOWED_ORIGINS=${_APP_ALLOWED_ORIGINS}
      - --set-secrets
      - SUPABASE_URL=SUPABASE_URL:latest,NEXT_PUBLIC_SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,WORKER_WEBHOOK_SECRET=WORKER_WEBHOOK_SECRET:latest,FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest,FIREBASE_CLIENT_EMAIL=FIREBASE_CLIENT_EMAIL:latest,FIREBASE_PRIVATE_KEY=FIREBASE_PRIVATE_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,OPENAI_BASE_URL=OPENAI_BASE_URL:latest

images:
  - ${_IMAGE}

substitutions:
  _REGION: asia-southeast1
  _SERVICE_NAME: papertrend-web-staging
  _REPOSITORY: papertrend
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
  _RUNTIME_SERVICE_ACCOUNT: papertrend-app-runtime@${PROJECT_ID}.iam.gserviceaccount.com
  _GCS_UPLOAD_BUCKET: research-trend-analysis-papertrend-uploads-staging
  _WORKER_SERVICE_URL: https://papertrend-node-service-staging-899665963783.asia-southeast1.run.app
  _APP_ALLOWED_ORIGINS: https://papertrend-extractor-llm-git-test-pchantarusorn-9175s-projects.vercel.app
  _NEXT_PUBLIC_AUTH_PROVIDER: firebase
  _NEXT_PUBLIC_FIREBASE_API_KEY: set-in-cloud-build-trigger
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: set-in-cloud-build-trigger
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: set-in-cloud-build-trigger
  _NEXT_PUBLIC_FIREBASE_APP_ID: set-in-cloud-build-trigger
  _NEXT_PUBLIC_SUPABASE_URL: set-in-cloud-build-trigger
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: set-in-cloud-build-trigger

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
