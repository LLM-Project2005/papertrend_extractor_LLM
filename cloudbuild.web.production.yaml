# Production web deployment. The Cloud Build production trigger must watch the
# main branch only; test continues to deploy the isolated pilot service.
steps:
  # Nothing deploys unless the tests pass (docs/32, 1.2).
  - id: test-web
    name: node:22
    entrypoint: bash
    dir: eil-dashboard
    args:
      - -ceu
      - |
        npm ci --no-audit --no-fund --loglevel=error
        npm test

  - id: deploy-web-production-candidate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --source
      - eil-dashboard
      - --project
      - ${PROJECT_ID}
      - --region
      - ${_REGION}
      - --platform
      - managed
      # The new revision takes no traffic until it answers its health check.
      - --no-traffic
      - --tag
      - candidate
      - --allow-unauthenticated
      - --memory
      - 1Gi
      - --cpu
      - "1"
      - --cpu-throttling
      - --timeout
      - "1800"
      - --concurrency
      - "20"
      - --min-instances
      - "0"
      - --max-instances
      - "2"
      - --ingress
      - all
      - --service-account
      - ${_RUNTIME_SERVICE_ACCOUNT}
      - --add-cloudsql-instances
      - ${_CLOUD_SQL_INSTANCE_CONNECTION_NAME}
      - --set-build-env-vars
      - NEXT_PUBLIC_AUTH_PROVIDER=firebase,NEXT_PUBLIC_SITE_URL=${_PUBLIC_SITE_URL},NEXT_PUBLIC_PROJECT_ANALYSIS_PROFILES_ENABLED=true,NEXT_PUBLIC_DIRECT_API_URL=${_INTERNAL_APP_URL},NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY},NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN},NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID},NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}
      - --set-env-vars
      - DEPLOYMENT_ENV=production,AUTH_PROVIDER=firebase,DATABASE_PROVIDER=cloud-sql,STORAGE_PROVIDER=gcs,GOOGLE_CLOUD_PROJECT_ID=${PROJECT_ID},GOOGLE_CLOUD_REGION=${_REGION},GCS_UPLOAD_BUCKET=${_GCS_UPLOAD_BUCKET},GOOGLE_PICKER_CLIENT_ID=${_GOOGLE_PICKER_CLIENT_ID},GOOGLE_PICKER_APP_ID=${_GOOGLE_PICKER_APP_ID},CLOUD_SQL_INSTANCE_CONNECTION_NAME=${_CLOUD_SQL_INSTANCE_CONNECTION_NAME},WORKER_SERVICE_URL=${_WORKER_SERVICE_URL},APP_PUBLIC_URL=${_INTERNAL_APP_URL},NEXT_PUBLIC_SITE_URL=${_PUBLIC_SITE_URL},FIREBASE_CHECK_REVOKED=true,FIREBASE_AUTO_PROVISION_VERIFIED_USERS=true,INVITE_CODE_REQUIRED=true,APP_ALLOWED_ORIGINS=${_APP_ALLOWED_ORIGINS},CLOUDSQL_POOL_MAX=5,LOGIN_RATE_LIMIT_ATTEMPTS=5,LOGIN_RATE_LIMIT_WINDOW_SECONDS=900,AI_DAILY_TOKEN_LIMIT=1000000,AI_DAILY_DEEP_RESEARCH_LIMIT=10,MAX_UPLOAD_BYTES=10485760,MAX_PDF_PAGES=80,PROJECT_ANALYSIS_PROFILES_ENABLED=true,REPOSITORY_CHAT_V2_ENABLED=true,KNOWLEDGE_CHAT_V3_ENABLED=true,REPOSITORY_HYBRID_RETRIEVAL_ENABLED=true,REPOSITORY_EMBEDDING_MODEL=openai/text-embedding-3-small,REPOSITORY_EMBEDDING_DIMENSIONS=1536,REPOSITORY_EMBEDDING_BATCH_SIZE=24,REPOSITORY_CHAT_ASYNC_PAPER_THRESHOLD=80,SEMANTIC_MAP_ENABLED=true,CLOUD_TASKS_LOCATION=${_REGION},REPOSITORY_CHAT_TASKS_QUEUE=${_REPOSITORY_CHAT_TASKS_QUEUE},SEMANTIC_MAP_TASKS_QUEUE=${_REPOSITORY_CHAT_TASKS_QUEUE},RECLASSIFICATION_TASKS_QUEUE=${_REPOSITORY_CHAT_TASKS_QUEUE},DEEP_RESEARCH_TASKS_QUEUE=${_DEEP_RESEARCH_TASKS_QUEUE}
      - --set-secrets
      - WORKER_WEBHOOK_SECRET=WORKER_WEBHOOK_SECRET:latest,FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest,FIREBASE_CLIENT_EMAIL=FIREBASE_CLIENT_EMAIL:latest,FIREBASE_PRIVATE_KEY=FIREBASE_PRIVATE_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,OPENAI_BASE_URL=OPENAI_BASE_URL:latest,GOOGLE_PICKER_API_KEY=GOOGLE_PICKER_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest

  # The candidate revision must answer /api/health before it takes traffic.
  - id: smoke-web-production-candidate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        url="$$(gcloud run services describe ${_SERVICE_NAME} --project ${PROJECT_ID} --region ${_REGION} --format='value(status.traffic[].url)' | tr ';' '\n' | grep '^https://candidate---' | head -n 1)"
        test -n "$$url" || { echo "no candidate URL"; exit 1; }
        for attempt in 1 2 3 4 5 6 7 8; do
          code="$$(curl -s -o /tmp/health.json -w '%{http_code}' "$$url/api/health" || true)"
          if [ "$$code" = "200" ] && grep -q '"ok":true' /tmp/health.json; then
            echo "candidate healthy at $$url"
            exit 0
          fi
          sleep 10
        done
        echo "candidate failed its health check (last status $$code)"
        exit 1

  - id: promote-web-production
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update-traffic
      - ${_SERVICE_NAME}
      - --project
      - ${PROJECT_ID}
      - --region
      - ${_REGION}
      - --to-latest

substitutions:
  _REGION: asia-southeast1
  _SERVICE_NAME: papertrend-web-production
  _RUNTIME_SERVICE_ACCOUNT: papertrend-web-production@${PROJECT_ID}.iam.gserviceaccount.com
  _CLOUD_SQL_INSTANCE_CONNECTION_NAME: research-trend-analysis:asia-southeast1:papertrend-pg
  _GCS_UPLOAD_BUCKET: research-trend-analysis-papertrend-uploads-production
  # Google Drive import through the Picker. The client ID and the app ID
  # (the project number) are meant for the browser; the Picker API key,
  # restricted to the Picker and Drive APIs and to Papertrend's addresses,
  # comes from Secret Manager (GOOGLE_PICKER_API_KEY).
  _GOOGLE_PICKER_CLIENT_ID: 899665963783-tiu4prv0a2ropier6rjrsb2dc52kbm12.apps.googleusercontent.com
  _GOOGLE_PICKER_APP_ID: "899665963783"
  _WORKER_SERVICE_URL: https://papertrend-worker-production-javhavgdsq-as.a.run.app
  # Chat reports, semantic maps and reclassification: not the one-at-a-time
  # ingestion queue, where they waited behind paper analysis (docs/32, 1.4).
  _REPOSITORY_CHAT_TASKS_QUEUE: papertrend-app-tasks-production
  _DEEP_RESEARCH_TASKS_QUEUE: papertrend-research-production
  _PUBLIC_SITE_URL: https://research-trend-analysis.web.app
  _INTERNAL_APP_URL: https://papertrend-web-production-javhavgdsq-as.a.run.app
  # Semicolons avoid gcloud's comma-delimited --set-env-vars parser.
  _APP_ALLOWED_ORIGINS: https://papertrend-web-production-javhavgdsq-as.a.run.app;https://research-trend-analysis.web.app;https://papertrend.web.app
  _NEXT_PUBLIC_FIREBASE_API_KEY: set-in-cloud-build-trigger
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: research-trend-analysis.firebaseapp.com
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: research-trend-analysis
  _NEXT_PUBLIC_FIREBASE_APP_ID: set-in-cloud-build-trigger

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
