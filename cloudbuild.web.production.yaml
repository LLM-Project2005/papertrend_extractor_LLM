# Phase 8D production candidate. This creates a separate Cloud Run service and
# does not change staging, the Cloud SQL pilot, Vercel, or production traffic.
steps:
  - id: deploy-web-production-candidate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --source
      - eil-dashboard
      - --project
      - ${PROJECT_ID}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - 1Gi
      - --cpu
      - "1"
      - --cpu-throttling
      - --timeout
      - "300"
      - --concurrency
      - "20"
      - --min-instances
      - "0"
      - --max-instances
      - "2"
      - --ingress
      - all
      - --service-account
      - ${_RUNTIME_SERVICE_ACCOUNT}
      - --add-cloudsql-instances
      - ${_CLOUD_SQL_INSTANCE_CONNECTION_NAME}
      - --set-build-env-vars
      - NEXT_PUBLIC_AUTH_PROVIDER=firebase,NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY},NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN},NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID},NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}
      - --set-env-vars
      - AUTH_PROVIDER=firebase,DATABASE_PROVIDER=cloud-sql,STORAGE_PROVIDER=gcs,GOOGLE_CLOUD_PROJECT_ID=${PROJECT_ID},GOOGLE_CLOUD_REGION=${_REGION},GCS_UPLOAD_BUCKET=${_GCS_UPLOAD_BUCKET},CLOUD_SQL_INSTANCE_CONNECTION_NAME=${_CLOUD_SQL_INSTANCE_CONNECTION_NAME},WORKER_SERVICE_URL=${_WORKER_SERVICE_URL},FIREBASE_CHECK_REVOKED=true,FIREBASE_AUTO_PROVISION_VERIFIED_USERS=true,APP_ALLOWED_ORIGINS=${_APP_ALLOWED_ORIGINS},CLOUDSQL_POOL_MAX=5,LOGIN_RATE_LIMIT_ATTEMPTS=5,LOGIN_RATE_LIMIT_WINDOW_SECONDS=900,AI_DAILY_MESSAGE_LIMIT=100,AI_DAILY_DEEP_RESEARCH_LIMIT=10,MAX_UPLOAD_BYTES=26214400,MAX_PDF_PAGES=80,REPOSITORY_CHAT_V2_ENABLED=true,KNOWLEDGE_CHAT_V3_ENABLED=true,REPOSITORY_HYBRID_RETRIEVAL_ENABLED=true,REPOSITORY_EMBEDDING_MODEL=openai/text-embedding-3-small,REPOSITORY_EMBEDDING_DIMENSIONS=1536,REPOSITORY_EMBEDDING_BATCH_SIZE=24,REPOSITORY_CHAT_ASYNC_PAPER_THRESHOLD=80,CLOUD_TASKS_LOCATION=${_REGION},REPOSITORY_CHAT_TASKS_QUEUE=${_REPOSITORY_CHAT_TASKS_QUEUE}
      - --set-secrets
      - WORKER_WEBHOOK_SECRET=WORKER_WEBHOOK_SECRET:latest,FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest,FIREBASE_CLIENT_EMAIL=FIREBASE_CLIENT_EMAIL:latest,FIREBASE_PRIVATE_KEY=FIREBASE_PRIVATE_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,OPENAI_BASE_URL=OPENAI_BASE_URL:latest,DATABASE_URL=DATABASE_URL:latest

substitutions:
  _REGION: asia-southeast1
  _SERVICE_NAME: papertrend-web-production
  _RUNTIME_SERVICE_ACCOUNT: papertrend-web-production@${PROJECT_ID}.iam.gserviceaccount.com
  _CLOUD_SQL_INSTANCE_CONNECTION_NAME: research-trend-analysis:asia-southeast1:papertrend-pg
  _GCS_UPLOAD_BUCKET: research-trend-analysis-papertrend-uploads-production
  _WORKER_SERVICE_URL: set-after-worker-deployment
  _REPOSITORY_CHAT_TASKS_QUEUE: papertrend-ingestion-production
  _APP_ALLOWED_ORIGINS: set-after-web-deployment
  _NEXT_PUBLIC_FIREBASE_API_KEY: set-in-cloud-build-trigger
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: research-trend-analysis.firebaseapp.com
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: research-trend-analysis
  _NEXT_PUBLIC_FIREBASE_APP_ID: set-in-cloud-build-trigger

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
